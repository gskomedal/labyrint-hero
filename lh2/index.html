<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Labyrint Hero 2 – Prototype</title>
    <!--
        Labyrint Hero 2 – 3D open-world prototype.
        No build tools: Three.js is loaded as an ES module from CDN by the
        inline module script at the bottom; everything else is classic
        global-scope scripts, same style as the main game.
        Testing: serve the repo root over HTTP for reliable module loading,
        e.g. `python3 -m http.server 8000` then open http://localhost:8000/lh2/
    -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
        <div id="science-panel"></div>
        <div id="top-right">
            <div id="element-counter">Grunnstoffer: 0/118</div>
            <div id="bag-counter">Sekk: 0/20</div>
            <button id="new-game-btn" title="Slett lagring og start på nytt">Nytt spill</button>
        </div>
        <div id="prompt" class="hidden"></div>
        <div id="action-progress" class="hidden"><div id="action-progress-fill"></div></div>
        <div id="toast-stack"></div>
        <div id="damage-flash"></div>
        <div id="crosshair" class="hidden"></div>
        <div id="mouse-hint">Klikk i spillvinduet for musstyring</div>
        <div id="help-line">WASD – gå &middot; Venstreklikk – hogg/slå &middot; Høyreklikk – bruk &middot; Tab – sekk &middot; K – ferdigheter &middot; B – grunnstoffbok &middot; V – mineralwiki &middot; M – kart</div>
        <canvas id="minimap" width="170" height="170"></canvas>
        <div id="fade-overlay"></div>
    </div>

    <!-- LH1's original Phaser UI scenes render in here (transparent overlay) -->
    <div id="lh1-ui"></div>
    <!-- Discovery popup above everything, incl. the LH1 UI overlay -->
    <div id="discovery-popup" class="hidden"></div>

    <!-- Phaser (vendored) – only used for the reused LH1 UI scenes -->
    <script src="vendor/phaser.min.js"></script>

    <!-- Reused from Labyrint Hero 1 (global scope, Phaser-free) -->
    <script src="../src/utils/EventBus.js"></script>
    <script src="../src/data/elements.js"></script>
    <script src="../src/data/minerals.js"></script>
    <script src="../src/data/alloys.js"></script>
    <script src="../src/data/molecules.js"></script>
    <script src="../src/data/items.js"></script>
    <script src="../src/systems/ElementTracker.js"></script>
    <script src="../src/systems/Inventory.js"></script>
    <script src="../src/systems/SmeltingSystem.js"></script>
    <script src="../src/systems/ChemistrySystem.js"></script>
    <script src="../src/data/musicPieces.js"></script>
    <script src="../src/systems/AudioManager.js"></script>

    <!-- Reused LH1 UI: skill system + original Phaser scenes -->
    <script src="../src/data/skills.js"></script>
    <script src="../src/utils/UITheme.js"></script>
    <script src="../src/utils/UIHelper.js"></script>
    <script src="../src/utils/TooltipManager.js"></script>
    <script src="../src/graphics/CharacterSprite.js"></script>
    <script src="../src/graphics/DetailedCharacterSprite.js"></script>
    <script src="../src/graphics/SceneBackgrounds.js"></script>
    <script src="../src/scenes/smeltery/SmelteryTabs.js"></script>
    <script src="../src/scenes/SkillScene.js"></script>
    <script src="../src/scenes/ElementBookScene.js"></script>
    <script src="../src/scenes/MineralWikiScene.js"></script>
    <script src="../src/scenes/SmelteryScene.js"></script>
    <script src="../src/scenes/ChemLabScene.js"></script>
    <script src="../src/scenes/InventoryScene.js"></script>
    <script src="../src/scenes/MerchantScene.js"></script>
    <script src="../src/scenes/CharacterCreatorScene.js"></script>

    <!-- Labyrint Hero 2 -->
    <script src="js/constants2.js"></script>
    <script src="js/noise.js"></script>
    <script src="js/SaveManager2.js"></script>
    <script src="js/Sciences.js"></script>
    <script src="js/lh1-shims.js"></script>
    <script src="js/Hero2.js"></script>
    <script src="js/world/Terrain.js"></script>
    <script src="js/world/MazeStructure.js"></script>
    <script src="js/world/CaveWorld.js"></script>
    <script src="js/world/OreDeposits.js"></script>
    <script src="js/world/Decorations.js"></script>
    <script src="js/Player.js"></script>
    <script src="js/FX.js"></script>
    <script src="js/Creatures.js"></script>
    <script src="js/CameraRig.js"></script>
    <script src="js/Interactions.js"></script>
    <script src="js/Mining.js"></script>
    <script src="js/ui/HUD.js"></script>
    <script src="js/ui/LH1UIHost.js"></script>
    <script src="js/ui/Minimap.js"></script>
    <script src="js/main2.js"></script>

    <!-- Three.js bridge: the only module script. Classic scripts above have
         already executed, so all LH2 globals exist when start() runs.
         Three.js r165 is vendored as a single ESM file (no UMD builds exist
         anymore) so the game works offline and without build tools. -->
    <script type="module">
        import * as THREE from './vendor/three.module.js';
        window.THREE = THREE;
        LH2Main.start();
    </script>
</body>
</html>
